<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Athena map glow overlay">
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#E5C57E"/>
    <stop offset="50%" stop-color="#B88743"/>
    <stop offset="100%" stop-color="#6E4E25"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1024" height="1024" fill="none"/>

<g id="athena-map-glow" data-motion-part="map-glow" fill="none" stroke="url(#gold)" stroke-linecap="round">
  <circle cx="512" cy="512" r="260" stroke-width="8" opacity=".55"/>
  <circle cx="512" cy="512" r="190" stroke-width="4" stroke-dasharray="10 18" opacity=".7"/>
  <circle cx="512" cy="512" r="105" stroke-width="5"/>
  <path d="M270 512 H754 M512 270 V754 M338 338 L686 686 M686 338 L338 686" stroke-width="3" opacity=".55"/>
  <g fill="#E5C57E" stroke="none">
    <circle cx="512" cy="252" r="12"/><circle cx="772" cy="512" r="12"/><circle cx="512" cy="772" r="12"/><circle cx="252" cy="512" r="12"/>
    <circle cx="362" cy="370" r="10"/><circle cx="662" cy="370" r="10"/><circle cx="362" cy="654" r="10"/><circle cx="662" cy="654" r="10"/>
  </g>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Evidence current status icon">
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#E7C784"/>
    <stop offset="50%" stop-color="#B98541"/>
    <stop offset="100%" stop-color="#6F4D22"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="512" height="512" fill="none"/>

<g id="status-evidence-current" data-motion-part="status-root">
  <circle cx="256" cy="256" r="196" fill="#101214" stroke="url(#gold)" stroke-width="12"/>
  <circle cx="256" cy="256" r="160" fill="#171B1E" stroke="#5FAF78" stroke-width="7" opacity=".92"/>
  <circle id="status-evidence-current-ring" data-motion-part="status-ring" cx="256" cy="256" r="134"
          fill="none" stroke="#5FAF78" stroke-width="4" stroke-dasharray="8 12" opacity=".6"/>
  
<rect x="193" y="174" width="126" height="164" rx="12" fill="#17201B" stroke="#5FAF78" stroke-width="10"/>
<path d="M219 220 H294 M219 252 H294 M219 284 H271" stroke="#EFE6D4" stroke-width="10" stroke-linecap="round"/>
<circle cx="302" cy="316" r="46" fill="#101214" stroke="url(#gold)" stroke-width="9"/>
<path id="evidence-current-check" data-motion-part="status-symbol"
      d="M280 317 L298 335 L327 298" fill="none" stroke="#5FAF78" stroke-width="13"
      stroke-linecap="round" stroke-linejoin="round"/>

</g>
</svg>
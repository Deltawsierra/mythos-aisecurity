<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Revoked status icon">
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#E7C784"/>
    <stop offset="50%" stop-color="#B98541"/>
    <stop offset="100%" stop-color="#6F4D22"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="512" height="512" fill="none"/>

<g id="status-revoked" data-motion-part="status-root">
  <circle cx="256" cy="256" r="196" fill="#101214" stroke="url(#gold)" stroke-width="12"/>
  <circle cx="256" cy="256" r="160" fill="#171B1E" stroke="#C9574E" stroke-width="7" opacity=".92"/>
  <circle id="status-revoked-ring" data-motion-part="status-ring" cx="256" cy="256" r="134"
          fill="none" stroke="#C9574E" stroke-width="4" stroke-dasharray="8 12" opacity=".6"/>
  
<circle cx="256" cy="236" r="74" fill="#281616" stroke="#C9574E" stroke-width="12"/>
<path id="revoked-seal-break" data-motion-part="status-symbol"
      d="M214 198 L298 282 M298 198 L214 282" stroke="#EFE6D4" stroke-width="20" stroke-linecap="round"/>
<path d="M211 318 L192 388 L256 355 L320 388 L301 318" fill="url(#gold)" opacity=".7"/>
<path d="M248 325 L263 342 L252 359 L271 376" fill="none" stroke="#C9574E" stroke-width="10"/>

</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 240" role="img" aria-label="Lifecycle connector base">
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#E2C17E"/>
    <stop offset="45%" stop-color="#B98A45"/>
    <stop offset="100%" stop-color="#73501F"/>
  </linearGradient>
  <radialGradient id="bronzeFace" cx="50%" cy="42%" r="62%">
    <stop offset="0%" stop-color="#3A3025"/>
    <stop offset="65%" stop-color="#1B1815"/>
    <stop offset="100%" stop-color="#0B0B0C"/>
  </radialGradient>
  <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity=".45"/>
  </filter>
</defs>

<rect width="1800" height="240" fill="none"/>
<g id="connector-base" data-motion-part="connector-base">
  <path d="M80 120 H1720" stroke="#46341D" stroke-width="8" stroke-linecap="round"/>
  <path d="M80 120 H1720" stroke="url(#gold)" stroke-width="2" opacity=".55"/>
  <g fill="#0D0E0F" stroke="url(#gold)" stroke-width="6">
    <circle cx="260" cy="120" r="36"/>
    <circle cx="580" cy="120" r="36"/>
    <circle cx="900" cy="120" r="36"/>
    <circle cx="1220" cy="120" r="36"/>
    <circle cx="1540" cy="120" r="36"/>
  </g>
</g>

</svg>
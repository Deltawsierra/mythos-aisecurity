<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Lifecycle inner ring">
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#E2C17E"/>
    <stop offset="45%" stop-color="#B98A45"/>
    <stop offset="100%" stop-color="#73501F"/>
  </linearGradient>
  <radialGradient id="bronzeFace" cx="50%" cy="42%" r="62%">
    <stop offset="0%" stop-color="#3A3025"/>
    <stop offset="65%" stop-color="#1B1815"/>
    <stop offset="100%" stop-color="#0B0B0C"/>
  </radialGradient>
  <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity=".45"/>
  </filter>
</defs>

<rect width="512" height="512" fill="none"/>
<g id="inner-ring" data-motion-part="inner-ring">
  <circle cx="256" cy="256" r="150" fill="none" stroke="#72552D" stroke-width="5" stroke-dasharray="4 10"/>
  <circle cx="256" cy="256" r="126" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="256" cy="256" r="106" fill="none" stroke="#4C3B24" stroke-width="2"/>
  <g fill="#E2C17E">
    <circle cx="256" cy="106" r="6"/>
    <circle cx="406" cy="256" r="6"/>
    <circle cx="256" cy="406" r="6"/>
    <circle cx="106" cy="256" r="6"/>
  </g>
</g>

</svg>
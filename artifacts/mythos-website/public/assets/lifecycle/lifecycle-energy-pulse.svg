<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 180" role="img" aria-label="Lifecycle energy pulse">
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#E2C17E"/>
    <stop offset="45%" stop-color="#B98A45"/>
    <stop offset="100%" stop-color="#73501F"/>
  </linearGradient>
  <radialGradient id="bronzeFace" cx="50%" cy="42%" r="62%">
    <stop offset="0%" stop-color="#3A3025"/>
    <stop offset="65%" stop-color="#1B1815"/>
    <stop offset="100%" stop-color="#0B0B0C"/>
  </radialGradient>
  <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity=".45"/>
  </filter>
</defs>

<rect width="512" height="180" fill="none"/>
<g id="energy-pulse" data-motion-part="energy-pulse" filter="url(#softGlow)">
  <path d="M36 90 H476" stroke="#5F4928" stroke-width="6" stroke-linecap="round"/>
  <path d="M36 90 H476" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="256" cy="90" r="26" fill="url(#gold)" opacity=".25"/>
  <circle cx="256" cy="90" r="14" fill="#E2C17E"/>
  <path d="M230 90 L256 64 L282 90 L256 116 Z" fill="none" stroke="#FFF0C7" stroke-width="3"/>
</g>

</svg>
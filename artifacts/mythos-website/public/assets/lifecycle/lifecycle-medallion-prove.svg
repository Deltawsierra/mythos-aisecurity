  <circle cx="256" cy="256" r="165" fill="url(#bronzeFace)" stroke="#9B7338" stroke-width="5"/>
  <circle id="inner-ring" data-motion-part="inner-ring" cx="256" cy="256" r="137" fill="none" stroke="#70542B" stroke-width="3" stroke-dasharray="4 9"/>
  <g id="relief" data-motion-part="relief">
    
<rect x="176" y="150" width="160" height="214" rx="14" fill="none" stroke="url(#gold)" stroke-width="9"/>
<path d="M202 197 H310 M202 229 H310 M202 261 H284" stroke="#D9B66E" stroke-width="5" stroke-linecap="round"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Test assurance lifecycle medallion">
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#E2C17E"/>
    <stop offset="45%" stop-color="#B98A45"/>
    <stop offset="100%" stop-color="#73501F"/>
  </linearGradient>
  <radialGradient id="bronzeFace" cx="50%" cy="42%" r="62%">
    <stop offset="0%" stop-color="#3A3025"/>
    <stop offset="65%" stop-color="#1B1815"/>
    <stop offset="100%" stop-color="#0B0B0C"/>
  </radialGradient>
  <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity=".45"/>
  </filter>
</defs>

<rect width="512" height="512" fill="none"/>
<g id="medallion" data-motion-part="medallion" filter="url(#shadow)">
  <circle id="outer-ring" data-motion-part="outer-ring" cx="256" cy="256" r="206" fill="#0B0C0D" stroke="url(#gold)" stroke-width="12"/>
  <circle cx="256" cy="256" r="187" fill="none" stroke="#5B4525" stroke-width="3"/>
  <circle cx="256" cy="256" r="165" fill="url(#bronzeFace)" stroke="#9B7338" stroke-width="5"/>
  <circle id="inner-ring" data-motion-part="inner-ring" cx="256" cy="256" r="137" fill="none" stroke="#70542B" stroke-width="3" stroke-dasharray="4 9"/>
  <g id="relief" data-motion-part="relief">
    
<path d="M186 180 C214 154 298 154 326 180 L314 308 C299 334 279 351 256 365
          C233 351 213 334 198 308 Z"
      fill="none" stroke="url(#gold)" stroke-width="10"/>
<path d="M256 138 L274 190 L256 334 L238 190 Z" fill="url(#gold)"/>
<path d="M232 140 L280 140 L270 157 L242 157 Z" fill="#D8B267"/>
<path d="M180 259 L332 259" stroke="#E1C078" stroke-width="6"/>
<path d="M196 208 L150 162" stroke="#B78139" stroke-width="7" stroke-linecap="round"/>
<path d="M316 208 L362 162" stroke="#B78139" stroke-width="7" stroke-linecap="round"/>

  </g>
  <g fill="url(#gold)">
    <path d="M256 26 l10 26 26 10-26 10-10 26-10-26-26-10 26-10z"/>
    <path d="M256 414 l10 26 26 10-26 10-10 26-10-26-26-10 26-10z"/>
    <path d="M26 256 l26-10 10-26 10 26 26 10-26 10-10 26-10-26z"/>
    <path d="M414 256 l26-10 10-26 10 26 26 10-26 10-10 26-10-26z"/>
  </g>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-label="Purple Team assurance path">
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#E7C784"/>
    <stop offset="50%" stop-color="#B98541"/>
    <stop offset="100%" stop-color="#6F4D22"/>
  </linearGradient>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="10" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="100%" height="100%" fill="none"/>

<g id="purple-path" data-motion-part="team-path" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path id="purple-path-base" d="M90 350 C260 350, 330 240, 500 250 C680 260, 735 460, 900 450 C1080 440, 1130 260, 1300 270 C1400 278, 1460 340, 1510 350" stroke="#5B4A34" stroke-width="14" opacity=".42"/>
  <path id="purple-path-active" d="M90 350 C260 350, 330 240, 500 250 C680 260, 735 460, 900 450 C1080 440, 1130 260, 1300 270 C1400 278, 1460 340, 1510 350" stroke="#9A63D4" stroke-width="8" opacity=".95" filter="url(#softGlow)"/>
  <path id="purple-path-highlight" d="M90 350 C260 350, 330 240, 500 250 C680 260, 735 460, 900 450 C1080 440, 1130 260, 1300 270 C1400 278, 1460 340, 1510 350" stroke="url(#gold)" stroke-width="3" opacity=".85"/>
</g>

    <g fill="#9A63D4" stroke="url(#gold)" stroke-width="5">
      <circle cx="90" cy="350" r="20"/>
      <circle cx="1510" cy="350" r="20"/>
    </g>
    
</svg>
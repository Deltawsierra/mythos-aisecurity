<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-label="Red Team assurance path">
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#E7C784"/>
    <stop offset="50%" stop-color="#B98541"/>
    <stop offset="100%" stop-color="#6F4D22"/>
  </linearGradient>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="10" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="100%" height="100%" fill="none"/>

<g id="red-path" data-motion-part="team-path" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path id="red-path-base" d="M90 525 C245 520, 290 350, 420 360 C560 370, 575 520, 720 510 C870 500, 920 300, 1060 322 C1190 342, 1265 520, 1510 470" stroke="#5B4A34" stroke-width="14" opacity=".42"/>
  <path id="red-path-active" d="M90 525 C245 520, 290 350, 420 360 C560 370, 575 520, 720 510 C870 500, 920 300, 1060 322 C1190 342, 1265 520, 1510 470" stroke="#D94A43" stroke-width="8" opacity=".95" filter="url(#softGlow)"/>
  <path id="red-path-highlight" d="M90 525 C245 520, 290 350, 420 360 C560 370, 575 520, 720 510 C870 500, 920 300, 1060 322 C1190 342, 1265 520, 1510 470" stroke="url(#gold)" stroke-width="3" opacity=".85"/>
</g>

    <g fill="#D94A43" stroke="url(#gold)" stroke-width="5">
      <circle cx="90" cy="525" r="20"/>
      <circle cx="1510" cy="470" r="20"/>
    </g>
    
</svg>
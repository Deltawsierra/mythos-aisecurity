<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="SPINE assurance core node">
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#E7C784"/>
    <stop offset="50%" stop-color="#B98541"/>
    <stop offset="100%" stop-color="#6F4D22"/>
  </linearGradient>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="10" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="100%" height="100%" fill="none"/>

<g id="spine-core-node" data-motion-part="spine-core-node" transform="translate(512 512)">
  <circle r="380" fill="#0B0D0E" stroke="url(#gold)" stroke-width="22"/>
  <circle r="322" fill="none" stroke="#665031" stroke-width="5" stroke-dasharray="9 16"/>
  <circle r="245" fill="#11161B" stroke="#7E6337" stroke-width="8"/>
  <g id="orbit-ring-a" data-motion-part="orbit-ring" fill="none" stroke="#E7C784" stroke-width="7" opacity=".85">
    <ellipse rx="270" ry="110" transform="rotate(18)"/>
    <ellipse rx="270" ry="110" transform="rotate(78)"/>
    <ellipse rx="270" ry="110" transform="rotate(138)"/>
  </g>
  <g stroke="url(#gold)" stroke-width="8" fill="none">
    <polygon points="0,-130 112,-65 112,65 0,130 -112,65 -112,-65"/>
    <polygon points="0,-68 59,-34 59,34 0,68 -59,34 -59,-34"/>
  </g>
  <circle r="28" fill="#E7C784" filter="url(#softGlow)"/>
  <g fill="#E7C784">
    <circle cx="0" cy="-270" r="16"/>
    <circle cx="234" cy="-135" r="16"/>
    <circle cx="234" cy="135" r="16"/>
    <circle cx="0" cy="270" r="16"/>
    <circle cx="-234" cy="135" r="16"/>
    <circle cx="-234" cy="-135" r="16"/>
  </g>
</g>

</svg>
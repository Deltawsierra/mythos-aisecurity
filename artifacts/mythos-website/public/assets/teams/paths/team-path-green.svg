<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-label="Green Team assurance path">
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#E7C784"/>
    <stop offset="50%" stop-color="#B98541"/>
    <stop offset="100%" stop-color="#6F4D22"/>
  </linearGradient>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="10" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="100%" height="100%" fill="none"/>

<g id="green-path" data-motion-part="team-path" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path id="green-path-base" d="M90 555 C265 520, 340 600, 520 560 C695 520, 740 385, 910 392 C1080 398, 1170 540, 1330 500 C1410 480, 1460 430, 1510 420" stroke="#5B4A34" stroke-width="14" opacity=".42"/>
  <path id="green-path-active" d="M90 555 C265 520, 340 600, 520 560 C695 520, 740 385, 910 392 C1080 398, 1170 540, 1330 500 C1410 480, 1460 430, 1510 420" stroke="#4E9E6A" stroke-width="8" opacity=".95" filter="url(#softGlow)"/>
  <path id="green-path-highlight" d="M90 555 C265 520, 340 600, 520 560 C695 520, 740 385, 910 392 C1080 398, 1170 540, 1330 500 C1410 480, 1460 430, 1510 420" stroke="url(#gold)" stroke-width="3" opacity=".85"/>
</g>

    <g fill="#4E9E6A" stroke="url(#gold)" stroke-width="5">
      <circle cx="90" cy="555" r="20"/>
      <circle cx="1510" cy="420" r="20"/>
    </g>
    
</svg>
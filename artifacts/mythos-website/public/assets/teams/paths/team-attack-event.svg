<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Attack event assurance icon">
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#E7C784"/>
    <stop offset="50%" stop-color="#B98541"/>
    <stop offset="100%" stop-color="#6F4D22"/>
  </linearGradient>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="10" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="100%" height="100%" fill="none"/>

<g id="attack-event" data-motion-part="attack-event" transform="translate(512 512)">
  <circle r="330" fill="#211010" stroke="url(#gold)" stroke-width="22"/>
  <circle r="235" fill="none" stroke="#D94A43" stroke-width="18" opacity=".88"/>
  <circle r="142" fill="none" stroke="#8B2D29" stroke-width="12"/>
  <circle r="58" fill="#D94A43" opacity=".96" filter="url(#softGlow)"/>
  <g stroke="#D94A43" stroke-width="14" stroke-linecap="round">
    <line x1="0" y1="-330" x2="0" y2="-225"/>
    <line x1="0" y1="225" x2="0" y2="330"/>
    <line x1="-330" y1="0" x2="-225" y2="0"/>
    <line x1="225" y1="0" x2="330" y2="0"/>
  </g>
  <path d="M-75 -210 L25 -30 L-35 -40 L40 180 L-45 35 L15 43 Z" fill="url(#gold)"/>
</g>

</svg>